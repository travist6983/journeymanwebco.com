# GitHub Pages (Jekyll) settings for journeymanwebco.com.
# These stay in the repo but are not published to the site.
# README patterns spell out both cases because Jekyll matches them case-sensitively.
exclude:
  - worker
  - scripts
  - prospects
  - "[Rr][Ee][Aa][Dd][Mm][Ee]"
  - "[Rr][Ee][Aa][Dd][Mm][Ee].*"
  - "**/[Rr][Ee][Aa][Dd][Mm][Ee]"
  - "**/[Rr][Ee][Aa][Dd][Mm][Ee].*"
